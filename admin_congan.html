<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản trị - Công an xã Duy Nghĩa</title>
    <link rel="icon" type="image/png" href="logo-cong-an-vector-1.png">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary-color: #004d99;
            --accent-color: #d32f2f;
            --bg-color: #f5f7fa;
            --white: #ffffff;
            --text-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
        }

        /* Login Overlay */
        #loginOverlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, var(--primary-color), #003366);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .login-box {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            text-align: center;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .login-box h2 {
            margin-bottom: 1.5rem;
            color: var(--primary-color);
        }

        .form-control {
            width: 100%;
            padding: 12px;
            margin-bottom: 1rem;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }

        .btn-login {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            width: 100%;
        }

        /* Dashboard */
        .dashboard {
            display: none;
            /* Hidden by default */
            padding: 2rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            background: white;
            padding: 1rem 2rem;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }

        .header h1 {
            color: var(--primary-color);
        }

        .btn-refresh {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .table-container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 800px;
        }

        th,
        td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        th {
            background-color: var(--primary-color);
            color: white;
            font-weight: 500;
        }

        tr:hover {
            background-color: #f9f9f9;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 500;
            background: #e3f2fd;
            color: #1976d2;
        }

        .attachment-link {
            color: var(--accent-color);
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .attachment-link:hover {
            text-decoration: underline;
        }

        .loading-spinner {
            text-align: center;
            padding: 2rem;
            color: #666;
            font-style: italic;
        }
    </style>
</head>

<body>

    <!-- Login Screen -->
    <div id="loginOverlay">
        <div class="login-box">
            <img src="logo-cong-an-vector-1.png" alt="Logo" style="width: 60px; margin-bottom: 10px;">
            <h2>Đăng Nhập Quản Trị</h2>
            <input type="password" id="passwordInput" class="form-control" placeholder="Nhập mật khẩu truy cập...">
            <button class="btn-login" onclick="checkLogin()">Vào Hệ Thống</button>
            <p id="errorMsg" style="color: red; margin-top: 10px; display: none;">Mật khẩu không đúng!</p>
        </div>
    </div>

    <!-- Dashboard Content -->
    <div class="dashboard" id="mainDashboard">
        <div class="header">
            <div>
                <h1>QUẢN LÝ HỒ SƠ</h1>
                <p>Tiếp nhận phản ánh liên quan đến Dịch vụ công trực tuyến</p>
            </div>
            <button class="btn-refresh" onclick="fetchData()">
                <i class="fas fa-sync-alt"></i> Tải lại dữ liệu
            </button>
        </div>

        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Ngày gửi</th>
                        <th>Họ và tên</th>
                        <th>Số điện thoại</th>
                        <th>Thủ tục</th>
                        <th>Nội dung</th>
                        <th>Đính kèm</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Data will be inserted here -->
                </tbody>
            </table>
            <div id="loading" class="loading-spinner">Đang tải dữ liệu...</div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>


</html>
